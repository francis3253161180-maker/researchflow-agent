<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResearchFlow Agent</title>
  <style>
    :root { --sidebar-width:340px; --ink:#14283a; --muted:#617689; --blue:#2376b8; --blue-soft:#e8f2fb; --line:#d9e4ed; --soft:#f4f8fb; --good:#22734b; --danger:#b33939; --panel:#fff; }
    * { box-sizing:border-box; } body { height:100vh; margin:0; overflow:hidden; color:var(--ink); background:#eff4f8; font:14px/1.5 Inter,"Microsoft YaHei",sans-serif; }
    .app { display:grid; grid-template-columns:var(--sidebar-width) 10px minmax(0,1fr); height:100vh; min-height:0; } aside { display:flex; min-width:0; min-height:0; flex-direction:column; gap:15px; padding:20px 14px; background:#f7fafc; border-right:1px solid var(--line); overflow:hidden; } .sidebar-resizer { position:relative; z-index:4; cursor:col-resize; background:#edf3f7; touch-action:none; } .sidebar-resizer::after { position:absolute; top:0; bottom:0; left:4px; width:2px; border-radius:99px; background:transparent; content:""; transition:background .15s; } .sidebar-resizer:hover::after, .sidebar-resizer.dragging::after { background:#72a9d2; }
    .brand { padding:4px 7px; } .brand h1 { margin:0; font-size:21px; letter-spacing:-.3px; } .brand p { margin:4px 0 0; color:var(--muted); font-size:12px; }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 6px 7px; font-size:13px; color:#4d6578; } .section-title strong { color:var(--ink); font-size:14px; }
    .sidebar-card, .composer { background:var(--panel); border:1px solid var(--line); border-radius:13px; box-shadow:0 5px 17px rgba(22,55,79,.045); }
    button, select, textarea, input { font:inherit; } button { border:0; border-radius:8px; padding:8px 10px; color:#fff; background:var(--blue); font-weight:700; cursor:pointer; } button:hover { filter:brightness(.96); } button:disabled { cursor:not-allowed; opacity:.62; } button.secondary { background:#6f8190; } button.ghost { padding:5px 8px; color:#42677f; background:transparent; } button.danger { padding:4px 7px; color:var(--danger); border:1px solid #e6b5b5; background:transparent; font-size:12px; }
    .sessions-panel { display:flex; min-height:155px; flex:1 1 52%; flex-direction:column; } .new-session { width:100%; flex:none; } .session-list { display:grid; min-width:0; flex:1; align-content:start; grid-auto-rows:max-content; gap:5px; margin-top:8px; overflow-x:hidden; overflow-y:auto; scrollbar-gutter:stable; } .session { width:100%; min-width:0; max-width:100%; overflow:hidden; padding:9px 10px; color:var(--ink); background:transparent; text-align:left; font-weight:600; } .session:hover, .session.active { background:var(--blue-soft); color:#155988; } .session span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .session small { display:block; overflow:hidden; margin-top:2px; color:var(--muted); text-overflow:ellipsis; white-space:nowrap; font-weight:400; font-size:11px; }
    .knowledge { min-height:190px; margin-top:0; padding:12px; flex:1 1 48%; overflow-x:hidden; overflow-y:auto; scrollbar-gutter:stable; } details summary { cursor:pointer; color:#315a75; font-weight:700; } .upload-form { display:grid; gap:8px; margin-top:9px; } .upload-form label, .mode label { color:#4d6578; font-size:12px; font-weight:700; } input, textarea, select { width:100%; color:var(--ink); border:1px solid #bcd0df; border-radius:8px; background:#fff; padding:8px 9px; } textarea { resize:vertical; }
    .small, .status { color:var(--muted); font-size:12px; } .status { min-height:18px; } .error { color:var(--danger); } .documents { display:grid; gap:7px; margin-top:10px; } .document { padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; } .document-row { display:flex; align-items:center; gap:6px; justify-content:space-between; } .document label { display:flex; min-width:0; align-items:center; gap:6px; font-size:12px; font-weight:700; } .document label b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .document input { width:auto; }
    main { display:flex; height:100vh; min-width:0; min-height:0; flex-direction:column; overflow:hidden; } .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:19px clamp(18px,4vw,52px) 13px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.83); } .topbar h2 { margin:0; font-size:19px; } .topbar p { margin:3px 0 0; color:var(--muted); font-size:12px; } .top-actions { display:flex; min-width:0; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; } .badge { overflow:hidden; color:var(--good); background:#eaf7ef; border-radius:999px; padding:5px 9px; text-overflow:ellipsis; font-size:12px; white-space:nowrap; } .reranker-toggle { margin:0; padding:6px 10px; color:#fff; font-size:12px; } .reranker-toggle.off { background:#6f8190; }
    .history { width:min(100%,1120px); min-height:0; flex:1; align-self:center; display:flex; flex-direction:column; gap:18px; padding:25px 22px; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable; } .empty { margin:auto; color:var(--muted); text-align:center; } .empty h3 { color:var(--ink); margin:0 0 5px; }
    .turn { display:flex; max-width:100%; flex:none; flex-direction:column; align-items:stretch; gap:7px; overflow:visible; } .message { padding:13px 15px; } .message.user { width:min(82%,760px); align-self:flex-end; border:1px solid #c8dfef; border-radius:16px 16px 4px 16px; background:#dff0fc; } .message-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; color:#3e6380; font-size:12px; font-weight:700; } .mode-badge { border-radius:999px; padding:2px 7px; background:#e8edf2; color:#506879; font-size:11px; font-weight:700; } .mode-badge.deep { background:#f8efdc; color:#926a18; }
    .answer { width:min(88%,860px); align-self:flex-start; padding:15px 17px; border:1px solid var(--line); border-radius:16px 16px 16px 4px; background:#fff; box-shadow:0 5px 17px rgba(22,55,79,.045); line-height:1.72; } .answer > :first-child { margin-top:0; } .answer > :last-child { margin-bottom:0; } .answer p { margin:0 0 12px; } .answer h1, .answer h2, .answer h3 { margin:18px 0 8px; line-height:1.35; } .answer h1 { font-size:20px; } .answer h2 { font-size:17px; } .answer h3 { font-size:15px; } .answer ul, .answer ol { margin:0 0 12px; padding-left:24px; } .answer li { margin:4px 0; } .answer code { padding:1px 4px; border-radius:4px; background:#e5edf4; font-family:Consolas,"Cascadia Code",monospace; font-size:.92em; } .answer pre { overflow:auto; margin:0 0 12px; padding:10px; border-radius:7px; background:#1d2b36; color:#e8f1f7; } .answer pre code { padding:0; background:transparent; color:inherit; } .answer blockquote { margin:0 0 12px; padding:4px 12px; border-left:3px solid #7daed5; color:#3f596d; } .answer hr { border:0; border-top:1px solid #cbdbe7; margin:16px 0; } .answer a { color:#1f608f; }
    .answer.pending { border-color:#b9d9ee; background:#f6fbff; } .progress-current { display:flex; align-items:center; gap:8px; color:#245f88; font-weight:700; } .progress-current::before { width:8px; height:8px; border-radius:50%; background:#2b82c4; box-shadow:0 0 0 4px #dceefa; content:""; animation:pulse 1.2s ease-in-out infinite; } .progress-steps { display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-top:11px; } .progress-step { border-radius:999px; padding:3px 8px; background:#e9f0f5; color:#64798a; font-size:11px; } .progress-step.running { color:#155c8f; background:#d9edf9; } .progress-step.completed { color:#23724c; background:#e5f5ea; } .progress-arrow { color:#9cadb9; font-size:13px; font-weight:700; line-height:1; } .progress-arrow.completed { color:#44a36f; } .pending-error { color:var(--danger); } @keyframes pulse { 50% { transform:scale(.72); opacity:.55; } }
    .turn-detail-button { display:flex; width:100%; align-items:center; justify-content:space-between; margin-top:14px; padding:8px 10px; border:1px solid #c9deed; border-radius:8px; color:#2f678f; background:#f3f8fc; font-size:12px; } .turn-detail-button:hover { background:#e8f3fb; } .turn-detail-button:focus-visible { outline:3px solid #82b9df; outline-offset:2px; } .turn-details { width:min(88%,860px); align-self:flex-start; overflow:hidden; border:1px solid var(--line); border-radius:11px; background:#fff; box-shadow:0 5px 17px rgba(22,55,79,.035); } .turn-meta { display:flex; flex-wrap:wrap; gap:7px; padding:10px 17px 9px; color:var(--muted); font-size:12px; } .query-info { margin:0 17px 12px; padding:8px 10px; border-left:3px solid #8ab7d8; border-radius:0 7px 7px 0; background:#f4f8fb; color:#4c6678; font-size:12px; line-height:1.55; } .query-info b { color:#315e7c; } .citation-list { border-top:1px solid var(--line); padding:0 17px 11px; } .citation { border-top:1px solid #edf2f5; padding:9px 0; font-size:12px; line-height:1.55; } .citation:first-child { border-top:0; } .citation-title { color:#1f608f; font-weight:700; } .trace { margin:0 17px 14px; border-top:1px solid var(--line); padding-top:9px; color:var(--muted); font-size:12px; } .trace summary { color:#43677e; } .trace ol { margin:7px 0 0; padding-left:20px; } .trace li { margin:3px 0; }
    .composer-wrap { width:min(100%,980px); align-self:center; padding:0 22px 22px; } .composer { padding:13px; } .composer-top { display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:8px; } .scope { min-width:0; } .scope summary { font-size:12px; } .scope-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:5px; padding:8px 0 2px; } .scope-list label { display:flex; align-items:center; gap:6px; color:#506879; font-size:12px; } .scope-list input { width:auto; } .mode { display:flex; align-items:center; gap:7px; white-space:nowrap; } .mode select { width:auto; padding:5px 7px; font-size:12px; }
    .composer-row { display:flex; align-items:flex-end; gap:9px; } #query { min-height:64px; max-height:180px; } #ask-button { flex:none; min-width:79px; min-height:43px; } #meta { margin-top:8px; color:var(--muted); font-size:12px; }
    @media(max-width:760px) { body { height:auto; overflow:auto; } .app { display:block; height:auto; min-height:100vh; } .sidebar-resizer { display:none; } aside { display:block; border-right:0; border-bottom:1px solid var(--line); padding:12px; overflow:visible; } .brand { margin-bottom:13px; } .sessions-panel { display:block; min-height:0; margin-bottom:14px; } .session-list { display:grid; max-height:255px; margin-top:8px; overflow-x:hidden; overflow-y:auto; } .session { min-width:0; border:1px solid var(--line); } .knowledge { min-height:0; max-height:470px; overflow-x:hidden; overflow-y:auto; } main { height:auto; overflow:visible; } .topbar { padding:13px 15px 10px; } .top-actions { justify-content:flex-start; } .history { min-height:400px; padding:15px 11px; overflow:visible; } .composer-wrap { padding:0 11px 12px; } .composer-top { align-items:flex-start; flex-direction:column; } .mode { width:100%; justify-content:space-between; } .mode select { flex:1; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><h1>ResearchFlow Agent</h1><p>科研文档 · 多轮问答 · 引用可追溯</p></div>
      <section class="sessions-panel"><div class="section-title"><strong>会话</strong><span id="session-count"></span></div><button class="new-session" onclick="newSession()">＋ 新建对话</button><div id="sessions" class="session-list"></div></section>
      <section class="sidebar-card knowledge">
        <div class="section-title"><strong>知识库</strong><span id="document-count"></span></div>
        <details><summary>导入资料</summary><div class="upload-form"><label>选择 PDF / DOCX / XLSX / Markdown / TXT（可多选）</label><input id="file" type="file" accept=".pdf,.docx,.xlsx,.md,.txt" multiple onchange="uploadSelectedFiles()" /><input id="source" value="local-upload" maxlength="500" placeholder="来源标记" /><div id="upload-status" class="status">选择文件后自动上传并解析。</div><label>或粘贴研究笔记</label><input id="title" value="研究笔记" /><textarea id="content" rows="4" placeholder="粘贴论文摘要、实验结论或阅读笔记…"></textarea><button class="secondary" onclick="ingestText()">写入文本笔记</button></div></details>
        <div id="documents" class="documents"><span class="small">正在加载…</span></div>
      </section>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" title="拖动调整侧边栏宽度" aria-label="调整侧边栏宽度" role="separator"></div>
    <main>
      <header class="topbar"><div><h2 id="conversation-title">新对话</h2><p id="conversation-subtitle">在同一会话内连续追问；每轮保留引用和 Agent 轨迹。</p></div><div class="top-actions"><span id="health" class="badge">正在检查服务状态…</span><button id="reranker-toggle" class="reranker-toggle" onclick="toggleReranker()" disabled>检查 BGE…</button></div></header>
      <section id="history" class="history"><div class="empty"><h3>开始研究对话</h3><div>导入资料后即可提问；后续追问会保留在同一会话中。</div></div></section>
      <div class="composer-wrap"><section class="composer"><div class="composer-top"><details class="scope"><summary>检索范围：全部文档（可展开限定来源）</summary><div id="scope-documents" class="scope-list"></div></details><div class="mode"><label for="thinking-mode">回答模式</label><select id="thinking-mode"><option value="disabled">快速回答</option><option value="enabled">深度思考</option></select></div></div><div class="composer-row"><textarea id="query" placeholder="输入问题；Enter 发送，Shift + Enter 换行"></textarea><button id="ask-button" onclick="ask()">发送</button></div><div id="meta"></div></section></div>
    </main>
  </div>
<script>
let activeSessionId = localStorage.getItem('researchflow-active-session') || null;
let asking = false;
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const escapeAttribute = value => escapeHtml(value).replace(/`/g, '&#96;');
async function request(url, options={}) { const response = await fetch(url, options); const body = response.status === 204 ? null : await response.json(); if (!response.ok) throw new Error(body?.detail || JSON.stringify(body)); return body; }
function renderInlineMarkdown(value) { return value.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_\n]+)__/g, '<strong>$1</strong>').replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/_([^_\n]+)_/g, '<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'); }
function renderMarkdown(value) { const lines = escapeHtml(value).replace(/\r\n?/g, '\n').split('\n'); const html = []; let paragraph = []; let list = null; let code = null; const flushParagraph = () => { if (paragraph.length) { html.push(`<p>${paragraph.map(renderInlineMarkdown).join('<br>')}</p>`); paragraph = []; } }; const flushList = () => { if (list) { html.push(`<${list.type}>${list.items.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join('')}</${list.type}>`); list = null; } }; for (const line of lines) { if (code) { if (/^```/.test(line)) { html.push(`<pre><code>${code.lines.join('\n')}</code></pre>`); code = null; } else code.lines.push(line); continue; } if (/^```/.test(line)) { flushParagraph(); flushList(); code = {lines:[]}; continue; } const heading = line.match(/^(#{1,3})\s+(.+)$/); if (heading) { flushParagraph(); flushList(); html.push(`<h${heading[1].length}>${renderInlineMarkdown(heading[2])}</h${heading[1].length}>`); continue; } if (/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/.test(line)) { flushParagraph(); flushList(); html.push('<hr>'); continue; } const quote = line.match(/^>\s?(.*)$/); if (quote) { flushParagraph(); flushList(); html.push(`<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`); continue; } const unordered = line.match(/^[-*+]\s+(.+)$/); const ordered = line.match(/^\d+\.\s+(.+)$/); if (unordered || ordered) { flushParagraph(); const type = unordered ? 'ul' : 'ol'; if (!list || list.type !== type) { flushList(); list = {type, items:[]}; } list.items.push((unordered || ordered)[1]); continue; } if (!line.trim()) { flushParagraph(); continue; } flushList(); paragraph.push(line); } if (code) html.push(`<pre><code>${code.lines.join('\n')}</code></pre>`); flushParagraph(); flushList(); return html.join('') || '<p>未返回可展示的内容。</p>'; }
function status(message, isError=false) { $('upload-status').textContent = message; $('upload-status').className = `status ${isError ? 'error' : ''}`; }
function formatTime(value) { return value ? new Date(value).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : ''; }
const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
async function waitForService(maxAttempts=15) { for (let attempt = 0; attempt < maxAttempts; attempt += 1) { try { await request('/health'); return true; } catch { if (attempt < maxAttempts - 1) await delay(500); } } return false; }
const progressOrder = ['plan', 'rewrite', 'retrieve', 'tool', 'answer', 'verify', 'persist'];
const progressLabels = {plan:'规划', rewrite:'改写', retrieve:'检索', tool:'工具', answer:'回答', verify:'校验', persist:'保存'};
function renderProgressSteps(stages) { const nodes = progressOrder.filter(node => stages[node]); return nodes.map((node, index) => `${index ? `<span class="progress-arrow ${stages[nodes[index - 1]] === 'completed' ? 'completed' : ''}" aria-hidden="true">→</span>` : ''}<span class="progress-step ${escapeAttribute(stages[node])}">${escapeHtml(progressLabels[node])}</span>`).join(''); }
function appendPendingTurn(query, thinkingMode) { const pendingId = `pending-${Date.now()}-${Math.random().toString(16).slice(2)}`; const history = $('history'); if (history.querySelector('.empty')) history.innerHTML = ''; history.insertAdjacentHTML('beforeend', `<article id="${pendingId}" class="turn pending-turn"><div class="message user"><div class="message-head"><span>你</span><span>${formatTime(new Date())}</span></div>${escapeHtml(query)}</div><div class="answer pending"><div class="message-head"><span>ResearchFlow Agent</span><span class="mode-badge ${thinkingMode === 'enabled' ? 'deep' : ''}">${thinkingMode === 'enabled' ? '深度思考' : '快速回答'}</span></div><div class="progress-current">正在连接 Agent 工作流…</div><div class="progress-steps"></div></div></article>`); scrollHistoryToBottom(); return $(pendingId); }
function updatePendingTurn(pending, packet) { if (!pending) return; const stages = JSON.parse(pending.dataset.stages || '{}'); if (packet.node) stages[packet.node] = packet.phase === 'completed' ? 'completed' : 'running'; pending.dataset.stages = JSON.stringify(stages); const current = pending.querySelector('.progress-current'); if (current) current.textContent = packet.message || 'Agent 正在执行…'; const steps = pending.querySelector('.progress-steps'); if (steps) steps.innerHTML = renderProgressSteps(stages); scrollHistoryToBottom(); }
function showPendingError(pending, message) { if (!pending) return; const current = pending.querySelector('.progress-current'); if (current) { current.classList.add('pending-error'); current.textContent = message; } }
async function streamChat(payload, onPacket) { const response = await fetch('/api/chat/stream', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); if (!response.ok) { let detail = ''; try { detail = (await response.json()).detail; } catch { detail = await response.text(); } throw new Error(detail || `请求失败（${response.status}）`); } if (!response.body) throw new Error('浏览器不支持流式响应。'); const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = ''; const dispatch = block => { const lines = block.split('\n'); const eventName = lines.find(line => line.startsWith('event:'))?.slice(6).trim() || 'message'; const dataLine = lines.find(line => line.startsWith('data:')); if (!dataLine) return; onPacket(eventName, JSON.parse(dataLine.slice(5).trim())); }; while (true) { const {done, value} = await reader.read(); buffer += decoder.decode(value || new Uint8Array(), {stream:!done}); const blocks = buffer.split('\n\n'); buffer = blocks.pop() || ''; blocks.filter(Boolean).forEach(dispatch); if (done) break; } if (buffer.trim()) dispatch(buffer); }
function renderCitations(citations) { if (!citations?.length) return ''; return `<div class="citation-list">${citations.map((c, i) => `<div class="citation"><div class="citation-title">[${i+1}] ${escapeHtml(c.title)}${c.page ? ` · 第 ${c.page} 页` : ''}</div><div class="small">${escapeHtml(c.filename || c.source)}${c.section ? ` · ${escapeHtml(c.section)}` : ''} · score ${Number(c.score).toFixed(3)}</div><div>${escapeHtml((c.content || '').slice(0, 360))}</div></div>`).join('')}</div>`; }
function renderTrace(turn) { const errors = turn.errors?.length ? `<div class="error">已记录错误：${escapeHtml(turn.errors.join(', '))}</div>` : ''; return `<details class="trace"><summary>查看 Agent 轨迹（累计耗时 / 节点耗时）</summary><ol>${(turn.events || []).map(event => `<li><b>${escapeHtml(event.node)}</b> · ${escapeHtml(event.detail)} · 累计 ${event.at_ms} ms${event.duration_ms !== undefined ? ` · 本节点 ${event.duration_ms} ms` : ''}</li>`).join('')}</ol>${errors}</details>`; }
function toggleTurn(button) { const turn = button.closest('.turn'); const details = turn.querySelector('.turn-details'); const expanded = details.hidden; details.hidden = !expanded; button.setAttribute('aria-expanded', String(expanded)); button.querySelector('.turn-expand').textContent = expanded ? '收起引用与运行轨迹 ▲' : '查看引用与运行轨迹 ▼'; }
function renderTurn(turn) { const mode = turn.thinking_mode === 'enabled' ? '深度思考' : '快速回答'; const rewritten = turn.retrieval_query && turn.retrieval_query !== turn.query; const detailId = `detail-${escapeAttribute(turn.run_id)}`; const queryInfo = turn.route === 'rag' ? `<div class="query-info"><b>检索 Query：</b>${escapeHtml(turn.retrieval_query || turn.query)}${rewritten ? '（由本会话此前的用户问题承接改写）' : ''}<br><b>改写状态：</b>${escapeHtml(turn.rewrite_reason || 'not_applicable')}　<b>验证：</b>${escapeHtml(turn.verify_reason || 'not_applicable')}</div>` : ''; const evidenceLabel = turn.citations?.length ? `${turn.citations.length} 条证据` : '运行信息'; return `<article class="turn"><div class="message user"><div class="message-head"><span>你</span><span>${formatTime(turn.created_at)}</span></div>${escapeHtml(turn.query)}</div><div class="answer"><div class="message-head"><span>ResearchFlow Agent</span><span class="mode-badge ${turn.thinking_mode === 'enabled' ? 'deep' : ''}">${mode}</span></div>${renderMarkdown(turn.answer)}<button type="button" class="turn-detail-button" onclick="toggleTurn(this)" aria-expanded="false" aria-controls="${detailId}"><span class="turn-expand">查看引用与运行轨迹 ▼</span><span>${evidenceLabel}</span></button></div><div id="${detailId}" class="turn-details" hidden><div class="turn-meta"><span>route=${escapeHtml(turn.route)}</span><span>verified=${turn.verified}</span><span>${turn.latency_ms} ms</span><span>run=${escapeHtml(turn.run_id)}</span></div>${queryInfo}${renderCitations(turn.citations)}${renderTrace(turn)}</div></article>`; }
function scrollHistoryToBottom() { const history = $('history'); history.scrollTop = history.scrollHeight; }
async function loadHealth() { try { const data = await request('/health'); const retrieval = data.embedding_provider === 'HashEmbedding' ? 'Hash 离线检索（不支持跨语言语义）' : data.embedding_provider; const reranker = data.reranker_active ? 'BGE 分片重排已启用' : `BGE 未启用（${data.reranker_requested === 'none' ? '配置关闭' : '可按需启动'}）`; $('health').textContent = `服务正常 · ${data.chunks} chunks · ${retrieval} · ${reranker} · ${data.llm_configured ? 'LLM 已配置' : '离线回答模式'}`; } catch { $('health').textContent = '服务暂不可用'; } }
async function loadRerankerControl() { try { const data = await request('/health'); const button = $('reranker-toggle'); button.disabled = !data.reranker_can_start; button.classList.toggle('off', !data.reranker_active); if (data.reranker_active) button.textContent = '关闭 BGE 分片重排'; else if (data.reranker_available) button.textContent = '启动 BGE 分片重排'; else button.textContent = data.reranker_requested === 'none' ? 'BGE 已配置关闭' : '启动 BGE（CPU，较慢）'; button.title = data.reranker_active ? '关闭已启用的 BGE 分片重排' : data.reranker_available ? '启用已加载的 BGE 分片重排' : '首次点击会加载 BGE；CPU 模式会明显增加检索延迟'; } catch { const button = $('reranker-toggle'); button.textContent = 'BGE 状态不可用'; button.disabled = true; } }
async function toggleReranker() { const button = $('reranker-toggle'); button.disabled = true; try { await request('/api/reranker/toggle', {method:'POST'}); await loadHealth(); await loadRerankerControl(); } catch (error) { alert(error.message); await loadRerankerControl(); } }
async function loadDocuments() { try { const docs = await request('/api/documents'); $('document-count').textContent = `${docs.length} 份`; $('documents').innerHTML = docs.length ? docs.map(doc => `<div class="document"><div class="document-row"><label><input class="scope-document" type="checkbox" value="${escapeAttribute(doc.id)}" /><b title="${escapeAttribute(doc.title)}">${escapeHtml(doc.title)}</b></label><button class="danger" onclick="deleteDocument('${doc.id}')">删除</button></div><div class="small">${escapeHtml(doc.filename || doc.source)} · ${doc.chunks} chunks</div></div>`).join('') : '<span class="small">暂无已导入资料。</span>'; $('scope-documents').innerHTML = docs.length ? docs.map(doc => `<label title="${escapeAttribute(doc.title)}"><input class="scope-document" type="checkbox" value="${escapeAttribute(doc.id)}" />${escapeHtml(doc.title)}</label>`).join('') : '<span class="small">暂无文档；将按空知识库路径回答。</span>'; syncScopeCheckboxes(); } catch (error) { $('documents').innerHTML = `<span class="small error">${escapeHtml(error.message)}</span>`; } }
function selectedDocumentIds() { return Array.from(document.querySelectorAll('#scope-documents .scope-document:checked')).map(input => input.value); }
function syncScopeCheckboxes() { const sidebar = Array.from(document.querySelectorAll('#documents .scope-document')); const scope = Array.from(document.querySelectorAll('#scope-documents .scope-document')); const update = (source, targets) => source.forEach(input => input.addEventListener('change', () => targets.filter(target => target.value === input.value).forEach(target => target.checked = input.checked))); update(sidebar, scope); update(scope, sidebar); }
async function ingestText() { try { const data = await request('/api/documents', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:$('title').value, source:$('source').value || 'manual', content:$('content').value})}); status(`已写入 ${data.chunks} 个分块。`); $('content').value = ''; await loadDocuments(); await loadHealth(); } catch (error) { status(error.message, true); } }
async function uploadSelectedFiles() { const selected = Array.from($('file').files); if (!selected.length) return status('请选择一个或多个文件。'); let chunks = 0; const failed = []; for (const [index, file] of selected.entries()) { status(`正在导入 ${index + 1}/${selected.length}：${file.name}…`); try { const form = new FormData(); form.append('file', file); form.append('source', $('source').value || 'upload'); const data = await request('/api/documents/upload', {method:'POST', body:form}); chunks += data.chunks; } catch (error) { failed.push(`${file.name}：${error.message}`); } } $('file').value = ''; await loadDocuments(); await loadHealth(); const completed = selected.length - failed.length; status(failed.length ? `已导入 ${completed}/${selected.length} 个文件，共 ${chunks} 个分块；失败：${failed.join('；')}` : `已导入 ${completed} 个文件，共 ${chunks} 个分块。`, Boolean(failed.length)); }
async function deleteDocument(id) { if (!confirm('删除该文档及其所有分块？')) return; try { await request(`/api/documents/${id}`, {method:'DELETE'}); await loadDocuments(); await loadHealth(); } catch (error) { alert(error.message); } }
async function loadSessions() { try { const sessions = await request('/api/sessions'); $('session-count').textContent = sessions.length ? `${sessions.length} 个` : ''; if (activeSessionId && !sessions.some(session => session.id === activeSessionId)) { activeSessionId = null; localStorage.removeItem('researchflow-active-session'); } $('sessions').innerHTML = sessions.length ? sessions.map(session => `<button class="session ${session.id === activeSessionId ? 'active' : ''}" onclick="selectSession('${session.id}')" title="${escapeAttribute(session.title)}"><span title="${escapeAttribute(session.title)}">${escapeHtml(session.title)}</span><small>${session.runs} 轮 · ${formatTime(session.updated_at)}</small></button>`).join('') : '<span class="small">暂无已保存会话。</span>'; if (activeSessionId) { const active = sessions.find(session => session.id === activeSessionId); $('conversation-title').textContent = active?.title || '研究对话'; $('conversation-subtitle').textContent = `本会话已有 ${active?.runs || 0} 个 Agent turn；每轮可展开引用和轨迹。`; } else { $('conversation-title').textContent = '新对话'; $('conversation-subtitle').textContent = '在同一会话内连续追问；每轮保留引用和 Agent 轨迹。'; } } catch (error) { $('sessions').innerHTML = `<span class="small error">${escapeHtml(error.message)}</span>`; } }
async function selectSession(sessionId) { activeSessionId = sessionId; localStorage.setItem('researchflow-active-session', sessionId); await Promise.all([loadSessions(), loadTurns()]); }
async function newSession() { try { const session = await request('/api/sessions', {method:'POST'}); activeSessionId = session.id; localStorage.setItem('researchflow-active-session', activeSessionId); $('history').innerHTML = '<div class="empty"><h3>新的研究对话</h3><div>提出第一个问题后，该会话会自动命名并保存。</div></div>'; await loadSessions(); $('query').focus(); } catch (error) { alert(error.message); } }
async function loadTurns() { if (!activeSessionId) return; try { const turns = await request(`/api/sessions/${activeSessionId}/turns`); $('history').innerHTML = turns.length ? turns.map(renderTurn).join('') : '<div class="empty"><h3>新的研究对话</h3><div>提出第一个问题后，该会话会自动命名并保存。</div></div>'; scrollHistoryToBottom(); } catch (error) { $('history').innerHTML = `<div class="empty error">${escapeHtml(error.message)}</div>`; } }
async function ensureActiveSession() { if (activeSessionId) return activeSessionId; const session = await request('/api/sessions', {method:'POST'}); activeSessionId = session.id; localStorage.setItem('researchflow-active-session', activeSessionId); return activeSessionId; }
async function ask() { if (asking) return; const query = $('query').value.trim(); if (!query) return $('query').focus(); asking = true; $('ask-button').disabled = true; $('query').disabled = true; $('meta').className = ''; $('meta').textContent = 'Agent 正在建立实时执行连接…'; let pending = null; let completed = null; try { const sessionId = await ensureActiveSession(); const documentIds = selectedDocumentIds(); const thinkingMode = $('thinking-mode').value; pending = appendPendingTurn(query, thinkingMode); $('query').value = ''; await streamChat({query, session_id:sessionId, document_ids:documentIds.length ? documentIds : null, thinking_mode:thinkingMode}, (eventName, packet) => { if (eventName === 'status') updatePendingTurn(pending, packet); else if (eventName === 'complete') completed = packet.result; else if (eventName === 'error') throw new Error(packet.message || 'Agent 流式执行失败。'); }); if (!completed) throw new Error('未收到 Agent 最终结果。'); pending.insertAdjacentHTML('afterend', renderTurn(completed)); pending.remove(); $('meta').textContent = `本轮完成：route=${completed.route} · 验证=${completed.verify_reason} · ${completed.latency_ms} ms`; await Promise.all([loadSessions(), loadTurns(), loadHealth()]); } catch (error) { showPendingError(pending, error.message); $('meta').textContent = error.message; $('meta').className = 'error'; } finally { asking = false; $('ask-button').disabled = false; $('query').disabled = false; $('query').focus(); } }
$('query').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); ask(); } });
(() => { const resizer = $('sidebar-resizer'); const stored = Number(localStorage.getItem('researchflow-sidebar-width')); const setWidth = width => { const bounded = Math.max(300, Math.min(520, Math.round(width))); document.documentElement.style.setProperty('--sidebar-width', `${bounded}px`); localStorage.setItem('researchflow-sidebar-width', String(bounded)); }; if (Number.isFinite(stored) && stored) setWidth(stored); resizer.addEventListener('pointerdown', event => { if (window.innerWidth <= 760) return; event.preventDefault(); resizer.classList.add('dragging'); resizer.setPointerCapture(event.pointerId); const move = moveEvent => setWidth(moveEvent.clientX); const stop = stopEvent => { resizer.classList.remove('dragging'); if (resizer.hasPointerCapture(stopEvent.pointerId)) resizer.releasePointerCapture(stopEvent.pointerId); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', stop); window.removeEventListener('pointercancel', stop); }; window.addEventListener('pointermove', move); window.addEventListener('pointerup', stop); window.addEventListener('pointercancel', stop); }); })();
async function initializeApplication() { if (!await waitForService()) { $('health').textContent = '服务暂不可用；请确认 ResearchFlow.bat 正在运行后刷新页面。'; $('sessions').innerHTML = '<span class="small error">服务尚未启动或已停止。</span>'; $('documents').innerHTML = '<span class="small error">服务尚未启动或已停止。</span>'; return; } await Promise.all([loadHealth(), loadRerankerControl(), loadDocuments(), loadSessions()]); if (activeSessionId) await loadTurns(); }
initializeApplication();
</script>
