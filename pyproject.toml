[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow-agent"
version = "0.1.0"
description = "A locally deployable research-document Agent/RAG service built with FastAPI and LangGraph."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=1.1,<2.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "fastembed>=0.7,<1.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "mcp[cli]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]
rerank = ["torch>=2.5", "transformers>=4.48,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=./.test-tmp"
